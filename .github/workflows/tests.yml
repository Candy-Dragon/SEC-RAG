name: Offline checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -s scripts/run.py env
      - run: python -s -m unittest discover -s tests
      - run: python -s scripts/run.py experiment --experiment examples/experiment_a.json
      - run: python -s scripts/run.py experiment --experiment examples/experiment_b.json
      - run: python -s scripts/run.py experiment --experiment examples/experiment_full.json --check-only
      - run: python -s scripts/run.py evaluate --source-dir storage/experiments/examples/demo_a --check-only
